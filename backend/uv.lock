[[package]]
name = "yourl-backend"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "alembic" },
    { name = "asyncpg" },
    { name = "bcrypt" },
    { name = "email-validator" },
    { name = "fastapi" },
    { name = "passlib", extra = ["bcrypt"] },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "python-dotenv" },
    { name = "python-jose" },
    { name = "redis" },
    { name = "sqlalchemy" },
    { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [
    { name = "fastapi", extra = ["standard"] },
    { name = "httpx" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.18.4" },
